<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="250">
  <defs>
    <linearGradient id="barGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <style>
    .hud-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .hud-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; }
  </style>

  <rect width="960" height="250" rx="10" fill="#070B12" />
  <rect x="0.5" y="0.5" width="959" height="249" rx="10" fill="none" stroke="#162232" stroke-width="1" />

  <!-- Section Title Header -->
  <g transform="translate(32, 28)">
    <text class="hud-mono" x="0" y="0" font-size="10.5" fill="#00F0FF" letter-spacing="2" font-weight="700">CAPABILITY TELEMETRY // PRODUCTION-READY STACKS</text>
    <text class="hud-mono" x="710" y="0" font-size="9" fill="#64748B" letter-spacing="1">INDEXED METRICS: 2026</text>
    <line x1="0" y1="12" x2="896" y2="12" stroke="#141E2C" stroke-width="1" />
  </g>

  <!-- Capability 1: Frontend & UI -->
  <g transform="translate(32, 60)">
    <text class="hud-sans" x="0" y="14" font-size="13.5" fill="#F8FAFC" font-weight="600">Reactive Interfaces &amp; State Engines</text>
    <text class="hud-mono" x="420" y="14" font-size="11" fill="#64748B">React 19 • Next.js (App Router) • React Flow • Zustand • Tailwind CSS</text>
    <text class="hud-mono" x="862" y="14" font-size="11" fill="#00F0FF" font-weight="700">94%</text>
    <!-- Progress Track & Fill -->
    <rect x="0" y="24" width="896" height="6" rx="3" fill="#101826" />
    <rect x="0" y="24" width="842" height="6" rx="3" fill="url(#barGradCyan)" />
  </g>

  <!-- Capability 2: Core Tooling & AST -->
  <g transform="translate(32, 108)">
    <text class="hud-sans" x="0" y="14" font-size="13.5" fill="#F8FAFC" font-weight="600">Core Systems, ASTs &amp; Tooling</text>
    <text class="hud-mono" x="420" y="14" font-size="11" fill="#64748B">Node.js 22 • TypeScript • AST Analysis • Dependency DAGs • C/C++</text>
    <text class="hud-mono" x="862" y="14" font-size="11" fill="#00F0FF" font-weight="700">88%</text>
    <rect x="0" y="24" width="896" height="6" rx="3" fill="#101826" />
    <rect x="0" y="24" width="788" height="6" rx="3" fill="url(#barGradCyan)" />
  </g>

  <!-- Capability 3: Backend & Network Dataflow -->
  <g transform="translate(32, 156)">
    <text class="hud-sans" x="0" y="14" font-size="13.5" fill="#F8FAFC" font-weight="600">Backend Services &amp; Real-Time Dataflow</text>
    <text class="hud-mono" x="420" y="14" font-size="11" fill="#64748B">Express.js 5 • RESTful Schema Contracts • WebSockets • Web Audio API</text>
    <text class="hud-mono" x="862" y="14" font-size="11" fill="#00F0FF" font-weight="700">82%</text>
    <rect x="0" y="24" width="896" height="6" rx="3" fill="#101826" />
    <rect x="0" y="24" width="734" height="6" rx="3" fill="url(#barGradCyan)" />
  </g>

  <!-- Capability 4: Testing & CI/CD -->
  <g transform="translate(32, 204)">
    <text class="hud-sans" x="0" y="14" font-size="13.5" fill="#F8FAFC" font-weight="600">Engineering Rigor &amp; CI Pipeline</text>
    <text class="hud-mono" x="420" y="14" font-size="11" fill="#64748B">Automated Unit &amp; Integration Testing (47+ Tests) • GitHub Actions • Git</text>
    <text class="hud-mono" x="862" y="14" font-size="11" fill="#00F0FF" font-weight="700">90%</text>
    <rect x="0" y="24" width="896" height="6" rx="3" fill="#101826" />
    <rect x="0" y="24" width="806" height="6" rx="3" fill="url(#barGradCyan)" />
  </g>
