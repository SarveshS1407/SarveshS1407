<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 20" width="100%" height="20">
  <defs>
    <linearGradient id="tracerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes scanAcross {
      0% { transform: translateX(-160px); }
      100% { transform: translateX(960px); }
    }
    .tracer {
      animation: scanAcross 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Baseline Subtle Rule -->
  <line x1="0" y1="10" x2="960" y2="10" stroke="#162232" stroke-width="1" />

  <!-- Animated Traveling Tracer Segment -->
  <g class="tracer">
    <rect x="0" y="9" width="160" height="2" fill="url(#tracerGrad)" />
    <circle cx="80" cy="10" r="2.5" fill="#00F0FF" />
  </g>

  <!-- Center Reticle Node -->
  <circle cx="480" cy="10" r="3" fill="#0B1320" stroke="#00F0FF" stroke-width="1" />
  <circle cx="480" cy="10" r="1.5" fill="#00F0FF" />
</svg>
